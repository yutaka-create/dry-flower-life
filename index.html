<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dry Flower Life</title>
  <link rel="icon" href="./img/favicon.ico">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header class="l-header">
    <div class="l-header__inner l-container">
      <h1 class="l-header__logo">
        <a href="index.html" class="l-header__logo-link" aria-label="Dry Flower Life トップページへ戻る">
          <img src="./img/logo.svg" alt="" width="190" height="26" decoding="async">
        </a>
      </h1>
      <nav class="l-header__nav" aria-label="グローバルナビゲーション">
        <ul class="l-header__nav-list">
          <li class="l-header__nav-item">
            <a class="l-header__nav-link" href="#profile">Profile</a>
          </li>
          <li class="l-header__nav-item">
            <a class="l-header__nav-link" href="#works">Works</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <div class="p-mv">
      <div class="l-container">
        <picture class="p-mv__picture">
          <source srcset="./img/mv.webp" type="image/webp">
          <img src="./img/mv.jpg" class="p-mv__img" alt="窓辺に飾られたドライフラワーとリース" width="960" height="600"
            fetchpriority="high" decoding="async">
        </picture>
      </div>
    </div>
    <section class="p-introduction" aria-labelledby="introduction-catchphrase">
      <div class="l-container">
        <h2 id="introduction-catchphrase" class="p-introduction__catchphrase">ドライフラワーのある生活で暮らしを豊かに</h2>
        <p class="p-introduction__text">
          アンティークな雰囲気を持ったドライフラワーは、インテリアとして生活を彩るだけでなく香りを楽しむこともできます。<br class="p-introduction__br">
          あなたの暮らしにもドライフラワーを取り入れてみませんか？
        </p>
      </div>
    </section>
    <section id="profile" class="p-profile" aria-labelledby="profile-heading">
      <div class="p-profile__inner l-container">
        <div class="p-profile__image">
          <picture class="p-profile__picture">
            <source srcset="./img/profile.webp" type="image/webp">
            <img src="./img/profile.jpg" class="p-profile__img" alt="" width="480" height="480" loading="lazy"
              decoding="async">
          </picture>
        </div>
        <div class="p-profile__content">
          <h2 id="profile-heading" class="p-profile__heading c-section-heading">
            <span class="c-section-heading__en">Profile</span>
            <span class="c-section-heading__ja">自己紹介</span>
          </h2>
          <p class="p-profile__text">
            趣味でドライフラワー作りを始め、現在はドライフラワー作家として活動しています。<br class="p-profile__br">
            インテリアとしてだけでなく、お誕生日や記念日等、お祝い用のフラワーアレンジメントも行っています。
          </p>
        </div>
      </div>
    </section>
    <section id="works" class="p-works" aria-labelledby="works-heading">
      <div class="l-container">
        <h2 id="works-heading" class="p-works__heading c-section-heading">
          <span class="c-section-heading__en">Works</span>
          <span class="c-section-heading__ja">作品一覧</span>
        </h2>
        <ul class="p-works__list">
          <li class="p-works__item">
            <picture class="p-works__picture">
              <source srcset="./img/works1.webp" type="image/webp">
              <img src="./img/works1.jpg" class="p-works__img" alt="大小2つの白い花瓶に生けた赤い実のついた枝" width="307" height="246"
                loading="lazy" decoding="async">
            </picture>
          </li>
          <li class="p-works__item">
            <picture class="p-works__picture">
              <source srcset="./img/works2.webp" type="image/webp">
              <img src="./img/works2.jpg" class="p-works__img" alt="白い背景に置かれた大理石調のパネルと、周囲を彩る細長い葉と小さなピンク色の花" width="307"
                height="246" loading="lazy" decoding="async">
            </picture>
          </li>
          <li class="p-works__item">
            <picture class="p-works__picture">
              <source srcset="./img/works3.webp" type="image/webp">
              <img src="./img/works3.jpg" class="p-works__img" alt="白い花瓶に生けられた、淡いベージュ色の穂を持つドライフラワー" width="307"
                height="246" loading="lazy" decoding="async">
            </picture>
          </li>
          <li class="p-works__item">
            <picture class="p-works__picture">
              <source srcset="./img/works4.webp" type="image/webp">
              <img src="./img/works4.jpg" class="p-works__img" alt="白い床に広げられた、ピンク色の花や赤茶色の葉、ユーカリなどのドライフラワー" width="307"
                height="246" loading="lazy" decoding="async">
            </picture>
          </li>
          <li class="p-works__item">
            <picture class="p-works__picture">
              <source srcset="./img/works5.webp" type="image/webp">
              <img src="./img/works5.jpg" class="p-works__img" alt="白い花瓶に生けられた、ピンクや紫、ベージュ色のドライフラワーの花束" width="307"
                height="246" loading="lazy" decoding="async">
            </picture>
          </li>
          <li class="p-works__item">
            <picture class="p-works__picture">
              <source srcset="./img/works6.webp" type="image/webp">
              <img src="./img/works6.jpg" class="p-works__img" alt="白い木の壁を背景に並べられた、ピンク色の花やユーカリなどのドライフラワー" width="307"
                height="246" loading="lazy" decoding="async">
            </picture>
          </li>
        </ul>
      </div>
    </section>
  </main>
  <footer class="l-footer">
    <div class="l-container">
      <small class="l-footer__copyright">&copy; Dry Flower Life.</small>
    </div>
  </footer>
</body>

</html>
